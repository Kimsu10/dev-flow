spring:
  application:
    name: devflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devflow}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 3000
      initialization-fail-timeout: -1
server:
  port: ${SERVER_PORT:8080}
mybatis:
  configuration:
    default-statement-timeout: 3

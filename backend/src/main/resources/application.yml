spring:
  application:
    name: devflow
  flyway:
    default-schema: blog
    schemas: blog
    locations: classpath:db/migration/blog
  datasource:
    url: ${DB_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:15432}/${POSTGRES_DB:devflow}}
    username: ${DB_USERNAME:${POSTGRES_USER}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD}}
    hikari:
      connection-timeout: 3000
      initialization-fail-timeout: -1
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:NONE}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
mybatis:
  type-handlers-package: com.devflow.common.mybatis
  configuration:
    default-statement-timeout: 3

analytics:
  retention-days: ${ANALYTICS_RETENTION_DAYS:365}
  public-origin: ${ANALYTICS_PUBLIC_ORIGIN:}

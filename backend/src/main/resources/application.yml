spring:
  application:
    name: devflow
  flyway:
    default-schema: blog
    schemas: blog
    locations: classpath:db/migration/blog
  datasource:
    url: ${DB_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:15432}/${POSTGRES_DB:devflow}}
    username: ${DB_USERNAME:${POSTGRES_USER}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD}}
    hikari:
      connection-timeout: 3000
      initialization-fail-timeout: -1
server:
  port: ${SERVER_PORT:8080}
mybatis:
  configuration:
    default-statement-timeout: 3
